name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PINTEREST_API_KEY: ${{ secrets.PINTEREST_API_KEY }}
          AI_INTEGRATIONS_OPENAI_BASE_URL: https://api.openai.com/v1
          AI_INTEGRATIONS_OPENAI_API_KEY: ${{ secrets.AI_INTEGRATIONS_OPENAI_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          SUPPORT_EMAIL: ${{ secrets.SUPPORT_EMAIL }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          envs: DATABASE_URL,JWT_SECRET,ADMIN_PASSWORD,UNSPLASH_ACCESS_KEY,PINTEREST_API_KEY,AI_INTEGRATIONS_OPENAI_BASE_URL,AI_INTEGRATIONS_OPENAI_API_KEY,EMAIL_USER,EMAIL_PASSWORD,SUPPORT_EMAIL
          script: |
            set -e

            cd /opt/bookvibe

            echo "==> git sync"
            git fetch origin main && git reset --hard origin/main

            echo "==> create env files"
            AI_INTEGRATIONS_OPENAI_BASE_URL="${AI_INTEGRATIONS_OPENAI_BASE_URL:-https://api.openai.com/v1}"
            AI_INTEGRATIONS_OPENAI_API_KEY="${AI_INTEGRATIONS_OPENAI_API_KEY:-disabled}"
            mkdir -p /root/.postgresql
            curl -fsSL https://storage.yandexcloud.net/cloud-certs/CA.pem -o /root/.postgresql/root.crt
            umask 077
            {
              printf 'DATABASE_URL=%s\n' "$DATABASE_URL"
              printf 'JWT_SECRET=%s\n' "$JWT_SECRET"
              printf 'ADMIN_PASSWORD=%s\n' "$ADMIN_PASSWORD"
              printf 'UNSPLASH_ACCESS_KEY=%s\n' "$UNSPLASH_ACCESS_KEY"
              printf 'PINTEREST_API_KEY=%s\n' "$PINTEREST_API_KEY"
              printf 'AI_INTEGRATIONS_OPENAI_BASE_URL=%s\n' "$AI_INTEGRATIONS_OPENAI_BASE_URL"
              printf 'AI_INTEGRATIONS_OPENAI_API_KEY=%s\n' "$AI_INTEGRATIONS_OPENAI_API_KEY"
              printf 'EMAIL_USER=%s\n' "$EMAIL_USER"
              printf 'EMAIL_PASSWORD=%s\n' "$EMAIL_PASSWORD"
              printf 'SUPPORT_EMAIL=%s\n' "$SUPPORT_EMAIL"
              printf 'PORT=%s\n' "8080"
              printf 'BASE_PATH=%s\n' "/"
              printf 'NODE_ENV=%s\n' "production"
              printf 'VITE_API_URL=%s\n' "/api"
              printf 'NODE_EXTRA_CA_CERTS=%s\n' "/root/.postgresql/root.crt"
              printf 'PGSSLROOTCERT=%s\n' "/root/.postgresql/root.crt"
              printf 'MODERATION_MODE=%s\n' "replace"
            } > .env
            cp .env .env.production

            echo "==> pnpm install"
            pnpm install --frozen-lockfile

            echo "==> Build API server"
            NODE_ENV=production pnpm --filter @workspace/api-server run build

            echo "==> Build frontend"
            PORT=22200 BASE_PATH=/ VITE_API_URL=/api NODE_ENV=production pnpm --filter @workspace/bookvibe run build

            echo "==> Restart pm2"
            export DATABASE_URL JWT_SECRET ADMIN_PASSWORD UNSPLASH_ACCESS_KEY PINTEREST_API_KEY
            export AI_INTEGRATIONS_OPENAI_BASE_URL AI_INTEGRATIONS_OPENAI_API_KEY
            export EMAIL_USER EMAIL_PASSWORD SUPPORT_EMAIL
            export PORT=8080
            export BASE_PATH=/
            export NODE_ENV=production
            export VITE_API_URL=/api
            export NODE_EXTRA_CA_CERTS=/root/.postgresql/root.crt
            export PGSSLROOTCERT=/root/.postgresql/root.crt
            export MODERATION_MODE=replace

            if pm2 describe bookvibe-app >/dev/null 2>&1; then
              pm2 restart bookvibe-app --update-env
            else
              pm2 start artifacts/api-server/dist/index.mjs --name bookvibe-app --update-env
            fi
            pm2 save
            systemctl reload nginx

            echo "==> Deploy complete"
